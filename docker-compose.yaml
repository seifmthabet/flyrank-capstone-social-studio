services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_USER: postgres
      POSTGRES_DB: social-studio
    ports:
      - "5432:5432"
    volumes: ["db-data:/var/lib/postgresql"]

  cache:
    image: redis:8.10-alpine
    restart: always
    ports:
      - "6379:6379"
    command:  redis-server --save 20 1 --loglevel warning --requirepass dev
    volumes:
      - cache:/data



volumes:
  cache:
    driver: local
  db-data: